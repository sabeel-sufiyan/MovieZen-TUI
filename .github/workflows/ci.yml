name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ci-hygiene"
      - run: cargo fmt --check
      - name: Verify branding guard
        run: bash .github/scripts/verify-branding.sh
      - name: Validate Unix installer syntax
        run: bash -n install.sh
      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
      - run: cargo check --all-targets --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Install musl compiler tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Verify musl target compilation
        run: cargo check --locked --target x86_64-unknown-linux-musl
      - name: Audit dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - name: Verify package
        run: cargo package --locked
      - name: Verify documentation build
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Test mdBook build
        run: |
          cp CHANGELOG.md docs/changelog.md && cp CONTRIBUTING.md docs/contributing.md
          mdbook build

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "ci-build-test-${{ matrix.os }}"
      - run: cargo build --all-features --locked
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run test suite with isolated configuration
        env:
          MOVIEZEN_CONFIG_DIR: ${{ runner.temp }}/mb_config
          MOVIEZEN_DATA_DIR: ${{ runner.temp }}/mb_data
        run: cargo nextest run --all-features --locked
      - name: Smoke-test binary startup
        run: cargo run --all-features --locked -- --version
      - name: Smoke-test the wordmark output
        run: cargo run --all-features --locked -- --logo

  npm-wrapper:
    name: npm wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Test the npm distribution wrapper
        run: node npm/test/smoke.js
      - name: Verify the package manifest
        working-directory: npm
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='moviezen-tui') throw new Error('wrong package name'); if(!p.bin.moviezen||!p.bin['moviezen-tui']) throw new Error('missing bin entries');"
          npm pack --dry-run
